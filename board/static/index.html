<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* shadcn-style light tokens (ported from 21st.dev JobCard / Sidebar patterns) */
  :root {
    --background: #f7f7f8; --card: #ffffff; --foreground: #09090b;
    --muted: #f4f4f5; --muted-fg: #71717a; --dim: #a1a1aa;
    --border: #e4e4e7; --border-hi: #d4d4d8; --ring: #18181b;
    --primary: #18181b; --primary-fg: #fafafa;
    --accent: #2563eb; --accent-soft: #eff6ff;
    --new: #059669; --new-soft: #ecfdf5; --new-line: #a7f3d0;
    --exc: #dc2626; --exc-soft: #fef2f2; --warn: #b45309; --warn-soft: #fffbeb;
    --rel: var(--accent); --oth: var(--muted-fg);
    --radius: 16px; --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.05); --shadow: 0 4px 14px -6px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.05);
    --font: "Inter", -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
    --sidebar-w: 260px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font: 14px/1.5 var(--font); }

  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(247,247,248,.85);
            backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  header { display: flex; align-items: center; gap: 14px; padding: 14px 24px 0; }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  #runinfo { color: var(--muted-fg); font-size: 12px; }
  nav { display: flex; gap: 2px; padding: 8px 24px 0; }
  nav button { background: none; border: none; color: var(--muted-fg); font: 500 13.5px var(--font);
               padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav button:hover { color: var(--foreground); }
  nav button.active { color: var(--foreground); border-bottom-color: var(--primary); }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 24px 8px; align-items: center; }
  input[type=search], select, .notes {
    background: var(--card); color: var(--foreground); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 12px; font: inherit; box-shadow: var(--shadow-sm); outline: none; }
  input[type=search]:focus, select:focus, .notes:focus { border-color: var(--ring); box-shadow: 0 0 0 3px rgba(24,24,27,.08); }
  input[type=search] { min-width: 260px; }
  input::placeholder { color: var(--dim); }
  .seg { display: flex; background: var(--muted); border: 1px solid var(--border);
         border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
  .seg button { background: none; border: none; color: var(--muted-fg); border-radius: 7px;
                padding: 5px 12px; cursor: pointer; font: 500 13px var(--font); }
  .seg button:hover { color: var(--foreground); }
  .seg button.active { background: var(--card); color: var(--foreground); box-shadow: var(--shadow-sm); }
  .iconbtn { display: inline-flex; align-items: center; gap: 6px; background: var(--card);
             border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 11px;
             cursor: pointer; font: 500 13px var(--font); color: var(--foreground); box-shadow: var(--shadow-sm); }
  .iconbtn:hover { border-color: var(--border-hi); background: var(--muted); }
  .exportbtn { margin-left: auto; }

  main { padding: 0 24px 80px; }

  /* ---- cards ---- */
  .row { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
         padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow-sm);
         transition: box-shadow .15s, border-color .15s; }
  .row:hover { border-color: var(--border-hi); box-shadow: var(--shadow); }
  .toprow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .title { font-weight: 600; color: var(--foreground); text-decoration: none; }
  .title:hover { color: var(--accent); }
  .sub { color: var(--muted-fg); font-size: 12.5px; margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

  /* posting card grid (JobCard layout) */
  #p-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; padding: 0; }
  #p-list .row { margin: 0; padding: 0; display: flex; flex-direction: column; }
  #p-list .row.expander { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 8px;
                          padding: 10px 16px; background: var(--muted); border-style: dashed; box-shadow: none; }
  #p-list .row.expander a { font-weight: 500; }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--muted); color: var(--foreground);
            display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: 0 0 auto;
            border: 1px solid var(--border); }
  .card-head .company-link { font-weight: 600; color: var(--foreground); cursor: pointer; }
  .card-head .company-link:hover { color: var(--accent); }
  .card-head .meta { color: var(--muted-fg); font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .card-head .right { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .card-body { padding: 12px 16px 14px; flex: 1; }
  .card-body .title { display: block; font-size: 16px; font-weight: 600; line-height: 1.35; letter-spacing: -.01em; }
  .card-body .lines { margin-top: 10px; display: grid; gap: 5px; font-size: 13px; color: var(--foreground); }
  .card-body .lines span b { font-weight: 500; color: var(--muted-fg); margin-right: 6px; }
  .card-body .chips { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .card-foot { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); }
  .card-foot { flex-wrap: nowrap; white-space: nowrap; }
  .card-foot .apply { margin-left: auto; background: var(--primary); color: var(--primary-fg); text-decoration: none;
                      border-radius: var(--radius-sm); padding: 7px 14px; font-weight: 500; font-size: 13px; }
  .card-foot .apply:hover { background: #27272a; }
  .status-sel { padding: 6px 9px; font-size: 12.5px; box-shadow: none; }
  .row:has(.badge.new) { border-color: var(--new-line); }

  .badge { font: 600 10.5px/1 var(--font); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; }
  .badge.new { background: var(--new-soft); color: var(--new); border: 1px solid var(--new-line); }
  .badge.closed { background: var(--exc-soft); color: var(--exc); border: 1px solid #fecaca; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted-fg); background: var(--muted); }
  .chip.relevant { color: var(--accent); border-color: #bfdbfe; background: var(--accent-soft); }
  .chip.excluded-interest { color: var(--exc); border-color: #fecaca; background: var(--exc-soft); }
  .company-link { color: var(--muted-fg); cursor: pointer; font-weight: 500; }
  .company-link:hover { color: var(--accent); }
  .mute-btn { font-size: 11px; color: var(--dim); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px; cursor: pointer; background: var(--card); }
  .mute-btn:hover { color: var(--exc); border-color: #fecaca; background: var(--exc-soft); }

  /* companies / people lists */
  .comp-head { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .caret { color: var(--dim); width: 12px; display: inline-block; transition: transform .15s; }
  .open .caret { transform: rotate(90deg); }
  .comp-name { font-weight: 600; font-size: 15px; flex: 0 0 auto; }
  .count { color: var(--muted-fg); }
  .count.has { color: var(--new); font-weight: 600; }
  .ats { font: 500 10.5px var(--mono); color: var(--muted-fg); border: 1px solid var(--border); padding: 2px 7px; border-radius: 6px; background: var(--muted); }
  .checked { margin-left: auto; color: var(--dim); font-size: 12px; }
  .checked.err { color: var(--exc); }
  .comp-body { display: none; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
  .open .comp-body { display: block; }
  .comp-body h4, .facet h4 { margin: 10px 0 6px; font: 600 11px var(--font); text-transform: uppercase; letter-spacing: .08em; color: var(--muted-fg); }
  .rec { display: flex; gap: 10px; align-items: center; padding: 5px 0; flex-wrap: wrap; }
  .email { font: 12.5px var(--mono); color: var(--foreground); }
  .copy { cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--muted-fg); border-radius: 6px; padding: 2px 8px; font: 11px var(--font); }
  .copy:hover { color: var(--foreground); border-color: var(--border-hi); }
  a { color: var(--accent); }
  .empty { color: var(--muted-fg); padding: 32px; text-align: center; grid-column: 1 / -1; }
  .unverified { color: var(--warn); font-size: 11px; background: var(--warn-soft); padding: 1px 6px; border-radius: 6px; }
  .notes { width: 100%; margin-top: 8px; min-height: 44px; resize: vertical; font-size: 12.5px; }
  code { font: 12px var(--mono); background: var(--muted); padding: 2px 6px; border-radius: 5px; }

  /* ---- toggleable sidebar ---- */
  .pwrap { display: flex; gap: 20px; padding: 0 24px 80px; align-items: flex-start; }
  .pwrap main { flex: 1; padding: 0; min-width: 0; }
  #sidebar { flex: 0 0 var(--sidebar-w); width: var(--sidebar-w); position: sticky; top: 92px;
             transition: flex-basis .2s ease, width .2s ease, opacity .15s; overflow: hidden; }
  body.sb-collapsed #sidebar { flex-basis: 0; width: 0; opacity: 0; pointer-events: none; }
  .facet { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
           padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--shadow-sm); width: var(--sidebar-w); }
  .facet h4 { margin: 0 0 8px; display: flex; align-items: baseline; }
  .facet .mini { font: 500 11px var(--font); color: var(--accent); cursor: pointer; margin-left: 10px; text-transform: none; letter-spacing: 0; }
  .facet .opts { max-height: 300px; overflow-y: auto; scrollbar-width: thin; }
  .facet label { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--foreground);
                 padding: 4px 6px; border-radius: 7px; cursor: pointer; }
  .facet label:hover { background: var(--muted); }
  .facet label input { accent-color: var(--primary); }
  .facet .cnt { margin-left: auto; color: var(--dim); font: 11px var(--mono); }
  #sb-toggle .ico { transition: transform .2s; }
  body.sb-collapsed #sb-toggle .ico { transform: rotate(180deg); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 820px) { .pwrap { flex-direction: column; } #sidebar { position: static; } .facet { width: 100%; } }
</style>
</head>
<body>
<div class="topbar">
<header>
  <h1>Internship Tracker</h1>
  <span id="runinfo"></span>
</header>
<nav>
  <button id="tab-postings" class="active">Postings</button>
  <button id="tab-companies">Companies</button>
  <button id="tab-people">People</button>
</nav>
</div>

<div id="view-postings">
  <div class="controls">
    <button class="iconbtn" id="sb-toggle" onclick="toggleSidebar()" title="Show / hide filters">
      <span class="ico">◧</span> Filters</button>
    <input type="search" id="p-search" placeholder="Search title, company, location…">
    <div class="seg" id="p-tagseg">
      <button data-tag="relevant" class="active">Relevant</button>
      <button data-tag="all">All</button>
      <button data-tag="other">Other</button>
      <button data-tag="excluded-interest">Filtered</button>
    </div>
    <select id="p-status">
      <option value="">Any status</option>
      <option>not seen</option><option>seen</option><option>applied</option>
      <option>rejected</option><option>offer</option>
    </select>
    <label class="count" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="p-closed"> show closed</label>
  </div>
  <div class="pwrap">
    <aside id="sidebar">
      <div class="facet">
        <h4>Locations
          <span class="mini" onclick="facetAll('loc')">all</span>
          <span class="mini" onclick="facetNone('loc')">none</span>
        </h4>
        <div class="opts" id="f-loc"></div>
      </div>
      <div class="facet">
        <h4>Companies
          <span class="mini" onclick="facetAll('comp')">all</span>
          <span class="mini" onclick="facetNone('comp')">none</span>
        </h4>
        <div class="opts" id="f-comp"></div>
      </div>
    </aside>
    <main id="p-list"></main>
  </div>
</div>

<div id="view-companies" style="display:none">
  <div class="controls">
    <input type="search" id="c-search" placeholder="Search companies…">
    <div class="seg" id="c-filterseg">
      <button data-f="all" class="active">All</button>
      <button data-f="open">Has openings</button>
      <button data-f="issues">Issues</button>
    </div>
    <select id="c-sort">
      <option value="open">Sort: open internships</option>
      <option value="name">Sort: name</option>
    </select>
    <button class="iconbtn exportbtn" onclick="location.href='/api/recruiters.csv'">Export recruiters CSV</button>
  </div>
  <main id="c-list"></main>
</div>

<div id="view-people" style="display:none">
  <div class="controls">
    <input type="search" id="pe-search" placeholder="Search people…">
    <span class="count">add with: <code>.venv/bin/python -m scraper.people add "Name" --linkedin URL</code></span>
  </div>
  <main id="pe-list"></main>
</div>

<script>
let POSTINGS = [], COMPANIES = [], PEOPLE = [];
const $ = (s) => document.querySelector(s);
const esc = (s) => (s ?? "").toString().replace(/[&<>"]/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- tabs ----
function showTab(name) {
  for (const t of ["postings", "companies", "people"]) {
    $("#view-" + t).style.display = name === t ? "" : "none";
    $("#tab-" + t).classList.toggle("active", name === t);
  }
}
$("#tab-postings").onclick = () => showTab("postings");
$("#tab-companies").onclick = () => showTab("companies");
$("#tab-people").onclick = () => showTab("people");

// ---- postings ----
let pTag = "relevant";
const COLLAPSE_AT = 5, COLLAPSE_SHOW = 3;
const expanded = new Set();

// location buckets: a posting can belong to several (multi-location strings)
const LOC_RULES = [
  ["Remote", ["remote"]],
  ["Canada", ["canada", ", can", "toronto", "vancouver", "montreal", "montréal",
    "waterloo", "ottawa", "burnaby", "markham", "edmonton", "calgary", "ontario",
    "british columbia", ", bc", "quebec"]],
  ["Boston / MA", ["boston", "massachusetts", ", ma,", ", ma ", "cambridge, ma",
    "north reading", "waltham", "devens", "somerville", "glen cove"]],
  ["California", ["california", "san francisco", "bay area", "los angeles",
    "san diego", "san jose", "mountain view", "palo alto", "menlo park",
    "sunnyvale", "santa clara", "berkeley", "alameda", "el segundo", "long beach",
    "irvine", "costa mesa", "hawthorne", "redondo", "burbank", "fremont",
    "oakland", "cupertino", ", ca,", ", ca "]],
  ["New York", ["new york", ", ny", "nyc", "brooklyn", "manhattan"]],
  ["Seattle / WA", ["seattle", "bellevue", "redmond", ", wa,", ", wa "]],
  ["Texas", ["austin", "texas", ", tx", "houston", "dallas", "plano", "brownsville"]],
  ["Other US", ["united states", "usa", ", co", "denver", "colorado", "pittsburgh",
    "pennsylvania", ", pa", "chicago", "illinois", "phoenix", "arizona", ", az",
    "atlanta", "georgia", "michigan", "minnesota", "north carolina", "virginia",
    "maryland", "washington, dc", "d.c.", "utah", "oregon", "idaho", "tennessee",
    "florida", "ohio", "nevada", "new jersey", "detroit"]],
  ["Europe", ["london", "united kingdom", ", uk", ", gbr", "england", "germany",
    "berlin", "munich", "paris", "france", "dublin", "ireland", ", irl",
    "amsterdam", "netherlands", "barcelona", "spain", "finland", "helsinki",
    "oulu", "zurich", "switzerland", "milton keynes", "luxembourg", "sweden",
    "stockholm", "poland", "italy", "lombardia", "romania"]],
  ["Asia", ["china", ", chn", "beijing", "shanghai", "shenzhen", "tokyo", "japan",
    ", jpn", "india", ", ind", "bengaluru", "bangalore", "hyderabad", "chennai",
    "singapore", ", sgp", "taiwan", "taipei", "seoul", "korea", "vietnam",
    "israel", "tel aviv"]],
  ["Other intl", ["australia", ", aus", "sydney", "melbourne", "new zealand",
    "brazil", ", bra", "mexico", "africa", ", zaf", "cape town", "colombia",
    "costa rica", "argentina", "chile"]],
];
// bare ISO-3166 codes (Amazon writes locations like "BRA", "CHN", "IRL")
const CODE_RULES = {
  "Canada": ["can"], "Other US": ["usa"],
  "Europe": ["gbr", "irl", "deu", "fra", "esp", "ita", "nld", "pol", "cze", "rou",
             "lux", "swe", "fin", "che", "aut", "bel", "prt", "dnk", "nor", "hun"],
  "Asia": ["chn", "jpn", "ind", "sgp", "twn", "kor", "vnm", "phl", "idn", "tha",
           "isr", "are", "sau", "hkg", "mys"],
  "Other intl": ["bra", "mex", "zaf", "col", "cri", "arg", "chl", "aus", "nzl", "egy", "tur"],
};
function bucketize(loc) {
  if (!loc) return ["Unknown"];
  const text = (loc + " ").toLowerCase();
  const out = LOC_RULES.filter(([, subs]) => subs.some((s) => text.includes(s)))
    .map(([name]) => name);
  const tokens = new Set(text.split(/[^a-z]+/));
  for (const [bucket, codes] of Object.entries(CODE_RULES))
    if (codes.some((c) => tokens.has(c)) && !out.includes(bucket)) out.push(bucket);
  return out.length ? out : ["Unknown"];
}

// facet state: sets of TURNED-OFF options, persisted per browser.
// First visit starts with far-away regions unticked; every click sticks.
const LOC_DEFAULT_OFF = ["Seattle / WA", "Texas", "Other US", "Europe", "Asia", "Other intl"];
const OFF = {
  loc: new Set(JSON.parse(localStorage.getItem("locOff") ?? JSON.stringify(LOC_DEFAULT_OFF))),
  comp: new Set(JSON.parse(localStorage.getItem("compOff") ||
                localStorage.getItem("mutedCompanies") || "[]")),
};
function saveFacets() {
  localStorage.setItem("locOff", JSON.stringify([...OFF.loc]));
  localStorage.setItem("compOff", JSON.stringify([...OFF.comp]));
}
function toggleFacet(kind, value, on) {
  if (on) OFF[kind].delete(value); else OFF[kind].add(value);
  saveFacets();
  renderPostings();
  renderFacets();
}
function facetAll(kind) { OFF[kind].clear(); saveFacets(); renderPostings(); renderFacets(); }
function facetNone(kind) {
  facetOptions(kind).forEach(([v]) => OFF[kind].add(v));
  saveFacets(); renderPostings(); renderFacets();
}
function muteCompany(name) { toggleFacet("comp", name, false); }
function expandCompany(name) { expanded.add(name); renderPostings(); }

function baseRows() {  // rows passing everything EXCEPT the facet filters
  const q = $("#p-search").value.toLowerCase();
  const st = $("#p-status").value;
  const showClosed = $("#p-closed").checked;
  return POSTINGS.filter((p) => {
    if (!showClosed && p.closed) return false;
    if (pTag !== "all" && p.tag !== pTag) return false;
    if (st && p.user_status !== st) return false;
    if (q && !(p.title + " " + p.company + " " + (p.location || "")).toLowerCase().includes(q)) return false;
    return true;
  });
}

function facetOptions(kind) {  // [[value, count], ...] for the current base rows
  const counts = {};
  for (const p of baseRows()) {
    if (kind === "loc") p.buckets.forEach((b) => { counts[b] = (counts[b] || 0) + 1; });
    else counts[p.company] = (counts[p.company] || 0) + 1;
  }
  // keep turned-off options visible even at count 0 so they can be re-enabled
  OFF[kind].forEach((v) => { if (!(v in counts)) counts[v] = 0; });
  const order = LOC_RULES.map(([n]) => n).concat(["Unknown"]);
  return Object.entries(counts).sort((a, b) =>
    kind === "loc" ? order.indexOf(a[0]) - order.indexOf(b[0])
                   : b[1] - a[1] || a[0].localeCompare(b[0]));
}

function renderFacets() {
  for (const kind of ["loc", "comp"]) {
    $("#f-" + kind).innerHTML = facetOptions(kind).map(([v, n]) => `
      <label><input type="checkbox" ${OFF[kind].has(v) ? "" : "checked"}
        onchange="toggleFacet('${kind}', ${esc(JSON.stringify(v))}, this.checked)">
        <span>${esc(v)}</span><span class="cnt">${n}</span></label>`).join("");
  }
}

$("#p-tagseg").addEventListener("click", (e) => {
  if (!e.target.dataset.tag) return;
  pTag = e.target.dataset.tag;
  [...$("#p-tagseg").children].forEach((b) => b.classList.toggle("active", b === e.target));
  renderPostings();
  renderFacets();
});
["p-search", "p-status", "p-closed"].forEach((id) =>
  $("#" + id).addEventListener("input", () => { renderPostings(); renderFacets(); }));

function renderPostings() {
  const q = $("#p-search").value;
  const rows = baseRows().filter((p) =>
    p.buckets.some((b) => !OFF.loc.has(b)) && !OFF.comp.has(p.company));

  // collapse companies that flood the feed (unless searching)
  const counts = {};
  rows.forEach((p) => { counts[p.company] = (counts[p.company] || 0) + 1; });
  const collapse = !q;
  const shown = {}, expanderDone = {};
  const html = [];
  for (const p of rows) {
    shown[p.company] = (shown[p.company] || 0) + 1;
    const flooding = collapse && counts[p.company] > COLLAPSE_AT && !expanded.has(p.company);
    if (flooding && shown[p.company] > COLLAPSE_SHOW) {
      if (!expanderDone[p.company]) {
        expanderDone[p.company] = true;
        html.push(`<div class="row expander">
          <span class="count">+${counts[p.company] - COLLAPSE_SHOW} more from ${esc(p.company)}</span>
          <a href="javascript:void 0" onclick="expandCompany(${esc(JSON.stringify(p.company))})">show all</a>
          &nbsp;·&nbsp;
          <a href="javascript:void 0" onclick="muteCompany(${esc(JSON.stringify(p.company))})">hide company</a>
        </div>`);
      }
      continue;
    }
    html.push(postingRow(p));
  }

  $("#p-list").innerHTML = html.length ? html.join("") :
    "<p class='empty'>No postings match — check the sidebar filters (some locations or companies may be unticked) or the All tag.</p>";
}

function postingRow(p) {
  const chips = (p.tag_hits || "").split(",").filter(Boolean).slice(0, 4)
    .map((h) => `<span class="chip ${esc(p.tag)}">${esc(h)}</span>`).join(" ");
  const initial = (p.company || "?").trim()[0].toUpperCase();
  return `<div class="row">
    <div class="card-head">
      <span class="avatar">${esc(initial)}</span>
      <div>
        <div class="company-link" onclick="gotoCompany(${p.company_id})">${esc(p.company)}</div>
        <div class="meta">first seen ${esc((p.first_seen || "").slice(0, 10))}</div>
      </div>
      <div class="right">
        ${p.is_new ? '<span class="badge new">New</span>' : ""}
        ${p.closed ? '<span class="badge closed">Closed</span>' : ""}
      </div>
    </div>
    <div class="card-body">
      <a class="title" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
      <div class="lines">
        ${p.location ? `<span><b>Location</b>${esc(p.location)}</span>` : ""}
        ${p.department ? `<span><b>Team</b>${esc(p.department)}</span>` : ""}
      </div>
      ${chips ? `<div class="chips">${chips}</div>` : ""}
    </div>
    <div class="card-foot">
      <select class="status-sel" onchange="setStatus(${p.id}, this.value)">
        ${["not seen","seen","applied","rejected","offer"].map(
          (s) => `<option ${s === p.user_status ? "selected" : ""}>${s}</option>`).join("")}
      </select>
      <span class="mute-btn" title="hide this company (sidebar re-enables it)"
            onclick="muteCompany(${esc(JSON.stringify(p.company))})">hide</span>
      <a class="apply" href="${esc(p.url)}" target="_blank" rel="noopener">Open posting</a>
    </div>
  </div>`;
}

function toggleSidebar() {
  const c = document.body.classList.toggle("sb-collapsed");
  localStorage.setItem("sbCollapsed", c ? "1" : "");
}
if (localStorage.getItem("sbCollapsed")) document.body.classList.add("sb-collapsed");

async function setStatus(id, status) {
  await fetch(`/api/postings/${id}/status`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status }),
  });
  const p = POSTINGS.find((x) => x.id === id);
  if (p) p.user_status = status;
}

function gotoCompany(id) {
  showTab("companies");
  $("#c-search").value = "";
  renderCompanies();
  const el = document.getElementById("comp-" + id);
  if (el) { el.classList.add("open"); el.scrollIntoView({ behavior: "smooth", block: "center" }); }
}

// ---- companies ----
let cFilter = "all";
$("#c-filterseg").addEventListener("click", (e) => {
  if (!e.target.dataset.f) return;
  cFilter = e.target.dataset.f;
  [...$("#c-filterseg").children].forEach((b) => b.classList.toggle("active", b === e.target));
  renderCompanies();
});
["c-search", "c-sort"].forEach((id) => $("#" + id).addEventListener("input", renderCompanies));

function renderCompanies() {
  const q = $("#c-search").value.toLowerCase();
  let rows = COMPANIES.filter((c) => {
    if (cFilter === "open" && !c.open_count) return false;
    if (cFilter === "issues" &&
        !(String(c.last_check_status || "").startsWith("error") ||
          c.discovery_status !== "ok")) return false;
    if (q && !c.name.toLowerCase().includes(q)) return false;
    return true;
  });
  rows = rows.sort((a, b) => $("#c-sort").value === "open"
    ? b.open_count - a.open_count || a.name.localeCompare(b.name)
    : a.name.localeCompare(b.name));
  $("#c-list").innerHTML = rows.length ? rows.map(companyRow).join("") :
    "<p class='empty'>No companies yet — run <code>make ingest</code> after dropping your exports into inputs/.</p>";
}

function companyRow(c) {
  const err = String(c.last_check_status || "").startsWith("error");
  const checked = c.last_checked
    ? `checked ${esc(c.last_checked.slice(0, 10))}${err ? " ⚠︎ error" : ""}`
    : (c.discovery_status === "ok" ? "not checked yet" : esc(c.discovery_status));
  const recs = c.recruiters.length
    ? c.recruiters.map((r) => `<div class="rec">
        <span>${esc(r.name)}</span><span class="count">— ${esc(r.title || "")}</span>
        ${r.email ? `<span class="email">${esc(r.email)}</span>
          <button class="copy" onclick="navigator.clipboard.writeText('${esc(r.email)}');this.textContent='copied';setTimeout(()=>this.textContent='copy',900)">copy</button>` : ""}
        ${r.email_status === "unverified" ? '<span class="unverified">unverified</span>' : ""}
        ${r.linkedin_url ? `<a href="${esc(r.linkedin_url)}" target="_blank" rel="noopener">LinkedIn</a>` : ""}
      </div>`).join("")
    : "<p class='empty'>No recruiter contacts yet.</p>";
  const posts = POSTINGS.filter((p) => p.company_id === c.id && !p.closed);
  const postList = posts.length
    ? posts.map((p) => `<div class="rec">${p.is_new ? '<span class="badge new">NEW</span>' : ""}
        <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
        ${p.location ? `<span class="count">${esc(p.location)}</span>` : ""}</div>`).join("")
    : "<p class='empty'>No open internship postings.</p>";
  return `<div class="row" id="comp-${c.id}">
    <div class="comp-head" onclick="this.parentElement.classList.toggle('open')">
      <span class="caret">▸</span>
      <span class="comp-name">${esc(c.name)}</span>
      ${c.ats_type ? `<span class="ats">${esc(c.ats_type)}</span>` : ""}
      <span class="count ${posts.length ? "has" : ""}">${posts.length} open internship${posts.length === 1 ? "" : "s"}</span>
      <span class="checked ${err ? "err" : ""}">${checked}</span>
    </div>
    <div class="comp-body">
      ${c.careers_url ? `<a href="${esc(c.careers_url)}" target="_blank" rel="noopener">careers page ↗</a>` : ""}
      <h4>Recruiters</h4>${recs}
      <h4>Open internships</h4>${postList}
    </div>
  </div>`;
}

// ---- people ----
$("#pe-search").addEventListener("input", renderPeople);
const PEOPLE_STATUSES = ["to contact", "contacted", "replied", "meeting", "closed"];

function renderPeople() {
  const q = $("#pe-search").value.toLowerCase();
  const rows = PEOPLE.filter((p) =>
    !q || (p.name + " " + (p.title || "") + " " + (p.company || "")).toLowerCase().includes(q));
  $("#pe-list").innerHTML = rows.length ? rows.map((p) => `<div class="row">
    <div class="toprow">
      <span class="comp-name">${esc(p.name)}</span>
      ${p.title ? `<span class="count">${esc(p.title)}${p.company ? " @ " + esc(p.company) : ""}</span>` : ""}
      <select class="status-sel" onchange="updatePerson(${p.id}, {status: this.value})">
        ${PEOPLE_STATUSES.map((st) => `<option ${st === p.user_status ? "selected" : ""}>${st}</option>`).join("")}
      </select>
    </div>
    <div class="sub">
      ${p.linkedin_url ? `<a href="${esc(p.linkedin_url)}" target="_blank" rel="noopener">LinkedIn</a>` : ""}
      ${p.email ? `<span class="email">${esc(p.email)}</span>
        <button class="copy" onclick="navigator.clipboard.writeText('${esc(p.email)}');this.textContent='copied';setTimeout(()=>this.textContent='copy',900)">copy</button>` : ""}
      ${p.email_status === "unverified" ? '<span class="unverified">unverified</span>' : ""}
      <span class="count">added ${esc(p.added || "")}</span>
    </div>
    <textarea class="notes" placeholder="notes…"
      onblur="updatePerson(${p.id}, {notes: this.value})">${esc(p.notes || "")}</textarea>
  </div>`).join("") : "<p class='empty'>No people yet — add one with the command above.</p>";
}

async function updatePerson(id, body) {
  await fetch(`/api/people/${id}`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const p = PEOPLE.find((x) => x.id === id);
  if (p) { if (body.status) p.user_status = body.status; if (body.notes != null) p.notes = body.notes; }
}

// ---- boot ----
async function boot() {
  const [p, c, run, pe] = await Promise.all([
    fetch("/api/postings").then((r) => r.json()),
    fetch("/api/companies").then((r) => r.json()),
    fetch("/api/runs/latest").then((r) => r.json()),
    fetch("/api/people").then((r) => r.json()),
  ]);
  POSTINGS = p; COMPANIES = c; PEOPLE = pe;
  POSTINGS.forEach((x) => { x.buckets = bucketize(x.location); });
  if (run && run.started) {
    $("#runinfo").textContent =
      `last check ${run.started.slice(0, 10)} · ${run.companies_checked} companies · ` +
      `${run.new_postings} new · ${run.companies_failed} failed`;
  }
  renderPostings();
  renderFacets();
  renderCompanies();
  renderPeople();
}
boot();
</script>
</body>
</html>
